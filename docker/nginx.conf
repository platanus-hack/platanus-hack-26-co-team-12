# Reproduce en local el reparto que hace CloudFront: el front sale de ficheros
# estáticos y solo /api/ llega al backend. Así el front se prueba servido de
# verdad, no a través de uvicorn.

server {
    listen 80;
    server_name _;

    root /srv;
    index index.html;

    # index.html referencia /static/app.js y /static/app.css, que en el
    # repositorio están en la misma carpeta que index.html.
    location /static/ {
        alias /srv/;
        access_log off;
        expires 1h;
    }

    location = / {
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las imágenes subidas van en el cuerpo de la petición.
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }
}
